<!-- @format -->

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        font-family: "Do Hyeon", sans-serif;
      }

      ::-webkit-scrollbar {
        display: none;
      }

      * {
        box-sizing: border-box;
      }

      .rainbow-bg {
        min-height: 100vh;
        background:
          radial-gradient(
            circle at top left,
            rgb(245, 133, 111) 0%,
            rgba(245, 133, 111, 0) 38%
          ),
          radial-gradient(
            circle at top center,
            rgb(244, 231, 97) 0%,
            rgba(244, 231, 97, 0) 42%
          ),
          radial-gradient(
            circle at top right,
            rgb(190, 250, 148) 0%,
            rgba(190, 250, 148, 0) 30%
          ),
          radial-gradient(
            circle at center,
            rgb(190, 250, 148) 0%,
            rgba(190, 250, 148, 0) 32%
          ),
          radial-gradient(
            circle at bottom left,
            rgb(190, 250, 147) 0%,
            rgba(190, 250, 147, 0) 28%
          ),
          radial-gradient(
            circle at bottom center,
            rgb(109, 190, 241) 0%,
            rgba(109, 190, 241, 0) 35%
          ),
          radial-gradient(
            circle at bottom right,
            rgb(238, 114, 189) 0%,
            rgba(238, 114, 189, 0) 24%
          ),
          linear-gradient(
            135deg,
            rgb(247, 171, 103) 0%,
            rgb(232, 245, 99) 28%,
            rgb(187, 249, 149) 52%,
            rgb(109, 190, 241) 78%,
            rgb(184, 118, 216) 100%
          );
        padding: 28px 28px 0;
        overflow: hidden;
      }

      .page-shell {
        min-height: calc(100vh - 28px);
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }

      .status-chip {
        background: rgba(255, 255, 255, 0.72);
        border: 4px solid #2a2016;
        color: #24170f;
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 24px;
        box-shadow: 0 6px 0 rgba(42, 32, 22, 0.28);
      }

      .score-chip {
        background: rgba(255, 244, 169, 0.88);
      }

      .quiz-panel {
        width: 75%;
        display: flex;
        flex-direction: column;
        gap: 18px;
        z-index: 2;
      }

      .quiz-card {
        background: rgba(8, 45, 18, 0.94);
        border: 10px solid rgb(133, 77, 60);
        border-radius: 28px;
        box-shadow:
          0 18px 30px rgba(0, 0, 0, 0.2),
          inset 0 0 0 4px rgba(255, 255, 255, 0.08);
        color: white;
        padding: 28px;
      }

      .quiz-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .quiz-badge {
        background: #ffed72;
        color: #2b180d;
        border: 4px solid #2b180d;
        border-radius: 16px;
        padding: 10px 16px;
        font-size: 26px;
        box-shadow: 0 6px 0 rgba(0, 0, 0, 0.18);
      }

      .current-score {
        font-size: 24px;
        color: #fff4b3;
      }

      .quiz-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 20px;
        align-items: stretch;
      }

      .quiz-info {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .info-block {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 18px 20px;
        border: 2px solid rgba(255, 255, 255, 0.14);
        flex: 1;
      }

      .info-label {
        font-size: 20px;
        color: #ffd95b;
        margin-bottom: 8px;
      }

      .info-value {
        font-size: 31px;
        line-height: 1.35;
        word-break: keep-all;
      }

      .question-text {
        min-height: 90px;
      }

      .hint-text {
        color: #dff7dd;
        min-height: 90px;
      }

      .image-panel {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        padding: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 2px solid rgba(255, 255, 255, 0.14);
        height: 550px;
      }

      .image-panel img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 18px;
        border: 5px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.18);
      }

      .answer-section {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      .burst-border {
        position: relative;
        width: 80%;
        height: 166px;
        background: #111;
        clip-path: polygon(
          7% 43%,
          19% 43%,
          13% 30%,
          22% 34%,
          18% 4%,
          35% 24%,
          40% 4%,
          47% 18%,
          54% 4%,
          59% 20%,
          68% 7%,
          64% 25%,
          78% 20%,
          71% 34%,
          92% 28%,
          78% 42%,
          93% 48%,
          76% 54%,
          80% 68%,
          71% 64%,
          79% 88%,
          64% 69%,
          64% 91%,
          53% 79%,
          47% 97%,
          40% 83%,
          35% 93%,
          30% 82%,
          19% 95%,
          20% 77%,
          6% 87%,
          8% 72%,
          2% 68%,
          15% 58%,
          0% 43%
        );
        filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.18));
      }

      .burst {
        position: absolute;
        inset: 0;
        background: #f7c928;
        clip-path: inherit;
        transform: scale(0.985);
        transform-origin: center;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        justify-content: center;
        color: #111;
        padding: 0 24px;
      }

      .burst input {
        width: 50%;
        margin-right: 9%;
        margin-bottom: 5px;
        padding: 12px 14px;
        border: none;
        outline: none;
        background: rgba(255, 255, 255, 0.55);
        color: #2b180d;
        font-size: 30px;
        font-family: "Do Hyeon", sans-serif;
        text-align: center;
        border-radius: 14px;
        appearance: none;
        -webkit-appearance: none;
      }

      .burst input:-webkit-autofill,
      .burst input:-webkit-autofill:hover,
      .burst input:-webkit-autofill:focus,
      .burst input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 1000px rgba(255, 255, 255, 0) inset;
        -webkit-text-fill-color: #2b180d;
        caret-color: #2b180d;

        width: 50%;
        margin-right: 60px;
        margin-bottom: 5px;
        padding: 12px 14px;
        border: none;
        outline: none;
        font-size: 30px;
        font-family: "Do Hyeon", sans-serif;
        text-align: center;
        border-radius: 14px;
        -webkit-appearance: none;

        transition: background-color 5000s ease-in-out 0s;
      }

      .action-buttons {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .shell-btn {
        position: relative;
        width: 150px;
        height: 150px;
        cursor: pointer;
        border: none;
        background: transparent;
        padding: 0;
        transition: transform 0.15s ease;
        font-family: "Do Hyeon", sans-serif;
      }

      .shell-btn:hover {
        transform: translateY(-3px) scale(1.02);
      }

      .shell-btn img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .shell-text {
        position: absolute;
        top: 55%;
        left: 53%;
        transform: translate(-50%, -50%);
        font-size: 26px;
        font-weight: bold;
        color: black;
      }

      .bonobono {
        position: absolute;
        right: 0;
        bottom: 0;
        width: min(260px, 23vw);
        height: auto;
        opacity: 0.97;
        z-index: 1;
      }

      /* 커스텀 알림 */
      .alert-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
        z-index: 9999;
        overflow: hidden;
      }

      .alert-overlay.show {
        display: flex;
      }

      .alert-card {
        position: relative;
        width: min(460px, 90vw);
        min-height: 250px;
        background: rgba(255, 255, 255, 0.96);
        border-radius: 30px;
        padding: 34px 28px 28px;
        text-align: center;
        box-shadow:
          0 24px 50px rgba(0, 0, 0, 0.22),
          inset 0 0 0 4px rgba(255, 255, 255, 0.5);
        transform: scale(0.8);
        opacity: 0;
        animation: popIn 0.28s ease forwards;
      }

      .alert-card.correct {
        border: 6px solid #3ecf62;
      }

      .alert-card.wrong {
        border: 6px solid #ff6868;
      }

      .alert-card.info {
        border: 6px solid #ffcb3d;
      }

      .alert-icon {
        font-size: 58px;
        margin-bottom: 10px;
      }

      .alert-title {
        font-size: 34px;
        color: #2b180d;
        margin-bottom: 12px;
      }

      .alert-message {
        font-size: 24px;
        line-height: 1.5;
        color: #3a2a21;
        word-break: keep-all;
        margin-bottom: 22px;
      }

      .alert-btn {
        min-width: 110px;
        border: none;
        border-radius: 16px;
        padding: 12px 24px;
        font-size: 22px;
        font-family: "Do Hyeon", sans-serif;
        cursor: pointer;
        color: #1f140d;
        background: linear-gradient(135deg, #ffe465, #ffb92e);
        box-shadow: 0 6px 0 rgba(73, 49, 18, 0.2);
      }

      .alert-btn:hover {
        transform: translateY(-2px);
      }

      .alert-btn:active {
        transform: translateY(1px);
      }

      .particle {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        pointer-events: none;
        animation: explode 0.95s ease-out forwards;
      }

      .shake {
        animation:
          popIn 0.28s ease forwards,
          shake 0.45s ease 0.05s;
      }

      @keyframes popIn {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes shake {
        0% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-12px);
        }
        40% {
          transform: translateX(12px);
        }
        60% {
          transform: translateX(-8px);
        }
        80% {
          transform: translateX(8px);
        }
        100% {
          transform: translateX(0);
        }
      }

      @keyframes explode {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(var(--x), var(--y)) scale(0.2);
          opacity: 0;
        }
      }

      @media (max-width: 980px) {
        .quiz-grid {
          grid-template-columns: 1fr;
        }

        .answer-section {
          flex-direction: column;
        }

        .burst-border {
          width: min(616px, 90vw);
          height: auto;
          aspect-ratio: 616 / 266;
        }

        .burst {
          width: calc(min(616px, 90vw) - 16px);
          height: auto;
          aspect-ratio: 600 / 250;
        }

        .burst input {
          width: 60%;
          font-size: 24px;
        }

        .bonobono {
          display: none;
        }

        .alert-title {
          font-size: 28px;
        }

        .alert-message {
          font-size: 20px;
        }
      }
      .timer-wrap {
        position: absolute;
        right: 5px;
        top: 70px;
        width: 90px;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .timer-svg {
        transform: rotate(-90deg);
      }

      .timer-bg {
        fill: none;
        stroke: #e5e7eb;
        stroke-width: 8;
      }

      .timer-progress {
        fill: none;
        stroke: #ff7a00;
        stroke-width: 8;
        stroke-linecap: round;
        transition: stroke-dashoffset 0.08s linear;
      }

      .timer-text {
        position: absolute;
        font-size: 24px;
        font-weight: 700;
        color: #222;
      }
    </style>
  </head>
  <body>
    <div class="rainbow-bg">
      <div class="page-shell">
        <header class="top-bar">
          <div class="status-chip" id="progressText">문제 1 / 10</div>
          <div class="status-chip score-chip">
            총점 <span id="totalScore">0</span>
          </div>
        </header>

        <div class="timer-wrap">
          <svg class="timer-svg" width="90" height="90" viewBox="0 0 90 90">
            <circle class="timer-bg" cx="45" cy="45" r="36"></circle>
            <circle class="timer-progress" cx="45" cy="45" r="36"></circle>
          </svg>
          <div id="timerText" class="timer-text">10</div>
        </div>
        <main class="quiz-panel">
          <section class="quiz-card">
            <div class="quiz-card-header">
              <div class="quiz-badge" id="questionBadge">QUESTION 1</div>
              <div class="current-score" id="currentQuestionScore">
                현재 문제 점수 10
              </div>
            </div>

            <div class="quiz-grid">
              <div class="quiz-info">
                <div class="info-block">
                  <div class="info-label">문제</div>
                  <div class="info-value question-text" id="questionText"></div>
                </div>

                <div class="info-block">
                  <div class="info-label">힌트</div>
                  <div class="info-value hint-text" id="hintText">
                    아직 공개된 힌트가 없습니다.
                  </div>
                </div>
              </div>

              <div class="image-panel">
                <img
                  id="quizImage"
                  src="./images/QuestionMark.jpg"
                  alt="quiz image"
                />
              </div>
            </div>
          </section>

          <section class="answer-section">
            <div class="burst-border">
              <div class="burst">
                <input id="answerInput" type="text" placeholder="정답 입력" />
              </div>
            </div>

            <div class="action-buttons">
              <button
                class="shell-btn"
                id="submitBtn"
                type="button"
                onclick="submitAnswer()"
              >
                <img src="./images/shell.png" alt="submit" />
                <span class="shell-text">제출</span>
              </button>

              <button
                class="shell-btn secondary"
                id="nextBtn"
                type="button"
                onclick="goNextQuestion()"
              >
                <img src="./images/shell.png" alt="next" />
                <span class="shell-text">다음</span>
              </button>
            </div>
          </section>
        </main>

        <img class="bonobono" src="./images/bonobono.png" alt="bonobono" />
      </div>
    </div>

    <!-- 커스텀 알림 -->
    <div class="alert-overlay" id="alertOverlay">
      <div class="alert-card" id="alertCard">
        <div class="alert-icon" id="alertIcon">🎉</div>
        <div class="alert-title" id="alertTitle">알림</div>
        <div class="alert-message" id="alertMessage">메시지</div>
        <button class="alert-btn" id="alertBtn" type="button">확인</button>
      </div>
    </div>
    <audio id="correctSound" src="./sounds/치는데.mp3"></audio>
    <audio id="wrongSound" src="./sounds/보노보노.mp3"></audio>

    <audio id="timer" src="./sounds/timer.mp3" loop></audio>
    <audio id="timer_end" src="./sounds/timer_end.mp3"></audio>
    <audio id="scoreSound" src="./sounds/score_page.mp3"></audio>
    <script>
      const progressText = document.getElementById("progressText");
      const totalScoreEl = document.getElementById("totalScore");
      const questionBadge = document.getElementById("questionBadge");
      const currentQuestionScore = document.getElementById(
        "currentQuestionScore",
      );
      const questionText = document.getElementById("questionText");
      const hintText = document.getElementById("hintText");
      const quizImage = document.getElementById("quizImage");
      const answerInput = document.getElementById("answerInput");
      const submitBtn = document.getElementById("submitBtn");
      const nextBtn = document.getElementById("nextBtn");

      const alertOverlay = document.getElementById("alertOverlay");
      const alertCard = document.getElementById("alertCard");
      const alertIcon = document.getElementById("alertIcon");
      const alertTitle = document.getElementById("alertTitle");
      const alertMessage = document.getElementById("alertMessage");
      const alertBtn = document.getElementById("alertBtn");

      const QUESTION_SCORE = 10;
      const HINT_QUESTION_SCORE = 5;

      const params = new URLSearchParams(window.location.search);
      const nickname = params.get("nickname");
      const category = params.get("category");

      const correctSound = document.getElementById("correctSound");
      const wrongSound = document.getElementById("wrongSound");

      const timerSound = document.getElementById("timer");
      const timerEndSound = document.getElementById("timer_end");

      const scoreSound = document.getElementById("scoreSound");

      const CATEGORY_FILE_MAP = {
        2025: "./meme2025.json",
        2024: "./meme2024.json",
        classic: "./memeClassic.json",
      };

      let memes = [];
      let currentIndex = 0;
      let totalScore = 0;
      let wrongCount = 0;
      let quizEnded = false;
      let alertConfirmCallback = null;

      function getStorageKey() {
        return nickname;
      }

      function getInitialUserData() {
        return {
          nickname: nickname,
          category: category,
          totalScore: 0,
          answers: [],
        };
      }

      function getUserQuizData() {
        const storageKey = getStorageKey();
        const saved = localStorage.getItem(storageKey);

        if (!saved) {
          return getInitialUserData();
        }

        try {
          const parsed = JSON.parse(saved);

          return {
            nickname: nickname,
            category: category,
            totalScore:
              typeof parsed.totalScore === "number" ? parsed.totalScore : 0,
            answers: Array.isArray(parsed.answers) ? parsed.answers : [],
          };
        } catch (error) {
          return getInitialUserData();
        }
      }

      function saveUserQuizData(data) {
        const storageKey = getStorageKey();
        localStorage.setItem(storageKey, JSON.stringify(data));
      }

      function resetCurrentUserQuizData() {
        const initialData = getInitialUserData();
        saveUserQuizData(initialData);
        totalScore = 0;
      }

      function upsertAnswerScore(questionIndex, score) {
        const userData = getUserQuizData();

        const existingIndex = userData.answers.findIndex(
          (item) => item.questionIndex === questionIndex,
        );

        const record = {
          questionIndex: questionIndex,
          score: score,
        };

        if (existingIndex >= 0) {
          userData.answers[existingIndex] = record;
        } else {
          userData.answers.push(record);
        }

        userData.totalScore = totalScore;
        userData.category = category;

        saveUserQuizData(userData);
      }

      function clearParticles() {
        const particles = alertOverlay.querySelectorAll(".particle");
        particles.forEach((particle) => particle.remove());
      }

      function createBurst(centerX, centerY) {
        const colors = [
          "#ff5f6d",
          "#ffc371",
          "#ffe066",
          "#59d98e",
          "#52c7ff",
          "#5d7cff",
          "#be6bff",
          "#ff7cc8",
        ];

        for (let i = 0; i < 26; i++) {
          const particle = document.createElement("span");
          const angle = (Math.PI * 2 * i) / 26;
          const distance = 55 + Math.random() * 95;

          particle.className = "particle";
          particle.style.left = `${centerX}px`;
          particle.style.top = `${centerY}px`;
          particle.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];
          particle.style.setProperty("--x", `${Math.cos(angle) * distance}px`);
          particle.style.setProperty("--y", `${Math.sin(angle) * distance}px`);

          alertOverlay.appendChild(particle);

          setTimeout(() => {
            particle.remove();
          }, 950);
        }
      }

      function launchFireworks() {
        const overlayRect = alertOverlay.getBoundingClientRect();
        createBurst(overlayRect.width * 0.35, overlayRect.height * 0.28);
        setTimeout(() => {
          createBurst(overlayRect.width * 0.5, overlayRect.height * 0.2);
        }, 150);
        setTimeout(() => {
          createBurst(overlayRect.width * 0.65, overlayRect.height * 0.3);
        }, 300);
      }

      function showAlert(type, title, message, onConfirm = null) {
        clearParticles();
        stopTimer();
        alertConfirmCallback = onConfirm;

        alertCard.classList.remove("correct", "wrong", "info", "shake");

        if (type === "correct") {
          alertCard.classList.add("correct");
          alertIcon.textContent = "🎉";
        } else if (type === "wrong") {
          alertCard.classList.add("wrong");
          alertIcon.textContent = "❌";
        } else {
          alertCard.classList.add("info");
          alertIcon.textContent = "⚠️";
        }

        alertTitle.textContent = title;
        alertMessage.textContent = message;
        alertOverlay.classList.add("show");

        void alertCard.offsetWidth;

        if (type === "correct") {
          launchFireworks();
        }

        if (type === "wrong") {
          alertCard.classList.add("shake");
        }
      }

      function closeAlert() {
        alertOverlay.classList.remove("show");
        alertCard.classList.remove("shake");
        clearParticles();

        const callback = alertConfirmCallback;
        alertConfirmCallback = null;

        if (typeof callback === "function") {
          callback();
        }
      }

      alertBtn.addEventListener("click", closeAlert);

      alertOverlay.addEventListener("click", (event) => {
        if (event.target === alertOverlay) {
          closeAlert();
        }
      });

      async function loadMemes() {
        if (!nickname) {
          showAlert("info", "알림", "닉네임 정보가 없습니다.", () => {
            window.location.href = "index.html";
          });
          return;
        }

        if (!category) {
          showAlert("info", "알림", "카테고리 정보가 없습니다.", () => {
            window.location.href = "index.html";
          });
          return;
        }

        const jsonPath = CATEGORY_FILE_MAP[category];

        if (!jsonPath) {
          showAlert("info", "알림", "올바르지 않은 카테고리입니다.", () => {
            window.location.href = "index.html";
          });
          return;
        }

        try {
          const response = await fetch(jsonPath);
          memes = await response.json();

          if (!Array.isArray(memes) || memes.length === 0) {
            console.error("문제 데이터를 불러오지 못했습니다.");
            showAlert("info", "알림", "문제 데이터를 불러오지 못했습니다.");
            return;
          }

          resetCurrentUserQuizData();
          totalScoreEl.textContent = totalScore;

          renderQuestion();
        } catch (error) {
          console.error("문제 JSON 불러오기 실패:", error);
          showAlert("info", "알림", "문제 파일을 불러오는 데 실패했습니다.");
        }
      }

      function renderQuestion() {
        if (currentIndex >= memes.length) {
          endQuiz();
          return;
        }

        const meme = memes[currentIndex];
        wrongCount = 0;

        progressText.textContent = `문제 ${currentIndex + 1} / ${memes.length}`;
        questionBadge.textContent = `QUESTION ${currentIndex + 1}`;
        currentQuestionScore.textContent = `현재 문제 점수 ${QUESTION_SCORE}`;
        totalScoreEl.textContent = totalScore;

        questionText.textContent = meme.question || "";
        hintText.textContent = "아직 공개된 힌트가 없습니다.";

        quizImage.src = meme.imgUrl || "";
        quizImage.alt = meme.memeName || "quiz image";

        answerInput.value = "";
        answerInput.focus();
      }

      function submitAnswer() {
        if (quizEnded || currentIndex >= memes.length) {
          return;
        }

        const meme = memes[currentIndex];
        const rawUserAnswer = answerInput.value.trim();

        if (rawUserAnswer === "") {
          showAlert("info", "잠깐!", "정답을 입력해주세요.");
          return;
        }

        if (meme.enableMemeAnswer.includes(rawUserAnswer)) {
          correctSound.currentTime = 0;
          correctSound.play();
          const earnedScore =
            wrongCount === 0 ? QUESTION_SCORE : HINT_QUESTION_SCORE;

          totalScore += earnedScore;
          totalScoreEl.textContent = totalScore;

          upsertAnswerScore(currentIndex, earnedScore);

          showAlert("correct", "정답!", "정답입니다!", () => {
            goNextQuestion();
          });
          return;
        }

        wrongCount += 1;

        if (wrongCount === 1) {
          wrongSound.currentTime = 0;
          wrongSound.play();
          hintText.textContent = meme.hint || "힌트가 없습니다.";
          currentQuestionScore.textContent = `현재 문제 점수 ${HINT_QUESTION_SCORE}`;
          answerInput.value = "";
          answerInput.focus();

          showAlert("wrong", "오답!", "틀렸습니다. 힌트가 공개됩니다.", () => {
            startQuestionTimer();
          });
          return;
        }

        if (wrongCount >= 2) {
          wrongSound.currentTime = 0;
          wrongSound.play();
          upsertAnswerScore(currentIndex, 0);
          showAlert(
            "wrong",
            "오답!",
            `틀렸습니다. 정답은 "${meme.memeName}" 입니다.`,
            () => {
              startQuestionTimer();
              goNextQuestion();
            },
          );
        }
      }

      function goNextQuestion() {
        currentIndex += 1;

        if (currentIndex >= memes.length) {
          endQuiz();
          return;
        }

        renderQuestion();
        startQuestionTimer();
      }

      function endQuiz() {
        quizEnded = true;
        stopTimer();

        const userData = getUserQuizData();
        userData.totalScore = totalScore;
        userData.category = category;
        saveUserQuizData(userData);

        if (scoreSound) {
          scoreSound.currentTime = 0;
          scoreSound.play().catch(e => console.log("사운드 재생 에러:", e));
        }

        showAlert("correct", "퀴즈 완료!", "모든 문제를 풀었습니다!\n결과를 확인해볼까요?", () => {
          window.location.href = `./Score.html?nickname=${encodeURIComponent(nickname)}`;
        });
      }

      answerInput.addEventListener("keydown", (event) => {
        if (alertOverlay.classList.contains("show")) {
          if (event.key === "Enter") {
            event.preventDefault();
          }
          return;
        }

        if (event.key === "Enter") {
          event.preventDefault();

          if (event.isComposing) {
            return;
          }

          submitAnswer();
        }
      });

      loadMemes();

      const timerText = document.getElementById("timerText");

      let timerToken = 0;

      function rAFTimer(endTime, token) {
        if (token !== timerToken) return;

        const now = Date.now();
        const end = endTime.getTime();
        const timeLeft = end - now;
        const meme = memes[currentIndex];

        const secondsLeft = Math.ceil(timeLeft / 1000);
        timerText.textContent = secondsLeft > 0 ? secondsLeft : 0;

        if (timeLeft <= 0) {
          timerSound.pause();
          timerEndSound.currentTime = 0;
          timerEndSound.play().catch(e => console.log("종료 사운드 대기"));

          wrongCount += 1;

          if (wrongCount === 1) {
            hintText.textContent = meme.hint || "힌트가 없습니다.";
            currentQuestionScore.textContent = `현재 문제 점수 ${HINT_QUESTION_SCORE}`;
            answerInput.value = "";

            showAlert(
              "wrong",
              "시간이 초과되었습니다.",
              "힌트가 공개됩니다.",
              () => {
                startQuestionTimer();
              },
            );

            return;
          }

          if (wrongCount >= 2) {
            showAlert(
              "wrong",
              "오답!",
              `틀렸습니다. 정답은 "${meme.memeName}" 입니다.`,
              () => {
                goNextQuestion();
              },
            );
            return;
          }
        }

        requestAnimationFrame(() => {
          rAFTimer(endTime, token);
        });
      }

      function startQuestionTimer() {
        timerToken += 1;
        const token = timerToken;

        const endTime = new Date(Date.now() + 10000);
        timerText.textContent = "10";

        timerSound.currentTime = 0;
        timerSound.play().catch(e => console.log("타이머 사운드 대기"));

        rAFTimer(endTime, token);
      }

      function stopTimer() {
        timerToken += 1;
        timerText.textContent = "멈춤";

        timerSound.pause();
      }

      startQuestionTimer();
    </script>
  </body>
</html>
