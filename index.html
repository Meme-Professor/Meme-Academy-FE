<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap"
      rel="stylesheet"
    />
    <title>Meme Academy</title>

    <link rel="stylesheet" href="./mainBG.css" />

    <style>
      body {
        font-family: "Do Hyeon", sans-serif;
      }

      ::-webkit-scrollbar {
        display: none;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 999;
        width: 100%;
        height: 100vh;
        background: rgba(0, 0, 0, 0.6);
        justify-content: center;
        align-items: center;
      }

      .modal.active {
        display: flex;
      }

      .modal_popup {
        width: 500px;
        max-height: 80vh;
        overflow-y: auto;
        background: #ffffff;
        border-radius: 20px;
        padding: 25px;
        text-align: center;
        animation: popup 0.3s ease;
      }

      @keyframes popup {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .modal_popup table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }

      .modal_popup th,
      .modal_popup td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
      }

      .modal_popup th {
        background: #f4f4f4;
      }

      .modal_buttons {
        margin-bottom: 10px;
      }

      .modal_buttons button {
        margin: 5px;
        padding: 8px 12px;
        border: none;
        border-radius: 10px;
        background: black;
        color: white;
        cursor: pointer;
      }

      .close_btn {
        padding: 10px 20px;
        background-color: rgb(116, 0, 0);
        border: none;
        border-radius: 5px;
        color: #fff;
        cursor: pointer;
        transition: box-shadow 0.2s;
      }

      .title {
        width: 100%;
        height: 320px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .title-arc {
        --step: 14deg;
        --start: -45deg;
        --radius: 520px;
        --font-size: 110px;
        --center-y: 215%;

        position: relative;
        width: 100%;
        margin-left: 40px;
        height: 320px;
      }

      .title-arc span {
        position: absolute;
        left: 50%;
        top: var(--center-y);
        font-size: var(--font-size);
        font-family: "Do Hyeon", sans-serif;
        line-height: 1;
        color: var(--c);
        -webkit-text-stroke: 2px #111;
        text-shadow: 6px 6px 0 #f47c48;

        --angle: calc(var(--start) + var(--i) * var(--step));

        animation: titleBounce 1.4s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.12s);
      }

      @keyframes titleBounce {
        0%,
        100% {
          transform: translate(-50%, -50%) rotate(var(--angle))
            translateY(calc(var(--radius) * -1));
        }
        50% {
          transform: translate(-50%, -58%) rotate(var(--angle))
            translateY(calc(var(--radius) * -1));
        }
      }

      .bottom-area {
        position: absolute;
        bottom: 0;
        width: 100%;
        padding: 0 100px;
        box-sizing: border-box;
      }

      .button-container {
        display: flex;
        align-items: end;
        justify-content: space-between;
        width: 100%;
      }

      .bonobono {
        width: 25%;
        height: auto;
        display: block;
      }

      .location-button {
        border: 0;
        border-radius: 20px;
        padding: 10px 20px;
        background-color: black;
        font-size: 48px;
        font-family: "Do Hyeon", sans-serif;
        color: white;
        white-space: nowrap;
        align-self: center;

        cursor: pointer;

        transition: all 0.2s ease;
      }
      .location-button:hover {
        transform: translateY(-6px) scale(1.05);

        background: linear-gradient(
          90deg,
          red,
          orange,
          yellow,
          green,
          cyan,
          blue,
          purple
        );

        color: white;

        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.3);
      }
      .location-button:active {
        transform: scale(0.95);
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
      }

      .rank-category-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
      }

      .rank-category-buttons button {
        border: none;
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 18px;
        font-family: "Do Hyeon", sans-serif;
        cursor: pointer;
        background: #222;
        color: white;
      }

      .table-wrap {
        height: 500px;
        overflow-y: auto;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 420px;
      }

      th,
      td {
        border-bottom: 1px solid #ddd;
        padding: 10px 14px;
        text-align: center;
      }

      th {
        background: #f4f4f4;
      }
    </style>
  </head>
  <body>
    <div class="modal">
      <div class="modal_popup">
        <div class="modal_buttons">
          <button onclick="make2024Modal()">2024</button>
          <button onclick="make2025Modal()">2025</button>
          <button onclick="makeClassicModal()">고전</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>등수</th>
                <th>아이디</th>
                <th>점수</th>
              </tr>
            </thead>
            <tbody id="ranking"></tbody>
          </table>
        </div>
        <div style="display: flex; justify-content: center; margin-top: 10px">
          <button type="button" class="close_btn" onClick="modalClose()">
            닫기
          </button>
        </div>
      </div>
    </div>

    <div class="rainbow-bg">
      <div class="title">
        <div class="title-arc">
          <span style="--i: 0; --c: #ff8a8a">제</span>
          <span style="--i: 1; --c: #ffd65c">1</span>
          <span style="--i: 2; --c: #ffe66d">회</span>
          <span style="--i: 3; --c: #2df0a1">밈</span>
          <span style="--i: 4; --c: #22a7ff">퀴</span>
          <span style="--i: 5; --c: #1792ff">즈</span>
          <span style="--i: 6; --c: #0d63d8">쇼</span>
          <span style="--i: 7; --c: #a95cff">~</span>
        </div>
      </div>

      <div class="bottom-area">
        <div class="button-container">
          <a class="location-button" href="./Nickname.html">게임 시작</a>
          <img class="bonobono" src="./images/bonobono.png" alt="Bonobono" />
          <button onClick="modalOpen()" class="location-button">
            랭킹 보기
          </button>
        </div>
      </div>
    </div>

    <audio id="bgm" src="./sounds/배경.mp3" loop></audio>

    <button
      id="musicToggle"
      style="
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        font-size: 20px;
        padding: 10px 14px;
        border-radius: 50%;
        border: none;
        background: black;
        color: white;
        cursor: pointer;
      "
    >
      🔊
    </button>
  </body>

  <script>
    const modal = document.querySelector(".modal");

    function modalOpen() {
      modal.classList.add("active");
      makeClassicModal();
    }

    function modalClose() {
      modal.classList.remove("active");
    }

    function makeClassicModal() {
      renderRanking(getRankingByCategory("classic"));
    }

    function make2024Modal() {
      renderRanking(getRankingByCategory("2024"));
    }

    function make2025Modal() {
      renderRanking(getRankingByCategory("2025"));
    }

    function renderRanking(data, title) {
      let rows = "";

      for (let i = 0; i < data.length; i++) {
        rows += `
          <tr>
            <td>${i + 1}등</td>
            <td>${data[i].id}</td>
            <td>${data[i].score}</td>
          </tr>
        `;
      }

      document.getElementById("ranking").innerHTML = `
        
          <tbody>
            ${rows}
          </tbody>
 
      `;
    }

    function getRankingByCategory(targetCategory) {
      const ranking = [];

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const rawValue = localStorage.getItem(key);

        if (!rawValue) continue;

        try {
          const data = JSON.parse(rawValue);

          if (
            data &&
            typeof data === "object" &&
            data.category === targetCategory &&
            typeof data.totalScore === "number"
          ) {
            ranking.push({
              id: data.nickname,
              score: data.totalScore,
            });
          }
        } catch (error) {
          continue;
        }
      }

      ranking.sort((a, b) => b.score - a.score);

      return ranking;
    }

    makeClassicModal();

    const bgm = document.getElementById("bgm");
    const musicBtn = document.getElementById("musicToggle");

    let isPlaying = false;

    // 눌러야 배경음악 시작
    document.addEventListener(
      "click",
      () => {
        if (!isPlaying) {
          bgm.play();
          isPlaying = true;
        }
      },
      { once: true },
    );

    // 끄고 켜기
    musicBtn.addEventListener("click", () => {
      if (bgm.paused) {
        bgm.play();
        musicBtn.textContent = "🔊";
      } else {
        bgm.pause();
        musicBtn.textContent = "🔇";
      }
    });
  </script>
</html>
