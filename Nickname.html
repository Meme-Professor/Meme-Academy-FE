<!-- @format -->

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>닉네임 입력</title>

    <style>
      body {
        margin: 0;
      }

      .container {
        width: 100%;
        height: 100vh;
        background: linear-gradient(
          90deg,
          red,
          orange,
          yellow,
          green,
          cyan,
          blue,
          purple
        );
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .nickname-box {
        width: 100%;
        height: 360px;
        background-image: url("box.png");
        background-size: 100% 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 80px;
      }

      .nickname-box input {
        font-size: 60px;
        padding: 10px 40px;
        border: none;
        outline: none;
        background: rgba(255, 255, 255, 0.3);
        text-align: center;
        font-weight: bold;
      }

      /* 버튼 그룹 */
      .btn-group {
        display: flex;
        gap: 20px;
        margin-bottom: 40px;
      }

      .btn {
        width: 180px;
        height: 100px;
        font-size: 30px;
        cursor: pointer;
        transition: 0.2s;
        background: rgba(255, 255, 255, 0.6);
        border: none;
      }

      .btn.selected {
        background-color: #222;
        color: white;
        border-color: #222;
      }

      .btn:hover {
        transform: scale(1.1);
      }

      /* 조개 버튼 */
      .shell-btn {
        background-color: rgb(255, 255, 255, 0);
        border: none;
        position: relative;
        width: 200px;
        height: 200px;
        cursor: pointer;
      }

      .shell-btn img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .shell-text {
        position: absolute;
        top: 55%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 40px;
        font-weight: bold;
        color: black;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="nickname-box">
        <input id="nickname" type="text" placeholder="닉네임을 입력하세요" />
      </div>

      <div class="btn-group">
        <button class="btn" data-value="2025">2025</button>
        <button class="btn" data-value="2024">2024</button>
        <button class="btn" data-value="classic">고전</button>
      </div>

      <!-- 시작 버튼 -->
      <button onClick="goPage()" class="shell-btn" href="./SolveProblem.html">
        <img src="./images/shell.png" alt="" />
        <div class="shell-text">시작</div>
      </button>
    </div>
  </body>
  <script>
    const buttons = document.querySelectorAll(".btn");

    let selectedCategory = "";

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        buttons.forEach((btn) => btn.classList.remove("selected"));
        button.classList.add("selected");
        selectedCategory = button.dataset.value;
      });
    });

    function goPage() {
      const nickname = document.getElementById("nickname").value.trim();

      if (nickname === "") {
        alert("닉네임을 입력해주세요.");
        return;
      }

      if (selectedCategory === "") {
        alert("카테고리를 선택해주세요.");
        return;
      }

      location.href = `./SolveProblem.html?nickname=${encodeURIComponent(nickname)}&category=${encodeURIComponent(selectedCategory)}`;
    }
  </script>
</html>
