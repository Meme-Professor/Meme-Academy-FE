<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        margin: 0;
      }

      .rainbow-bg {
        position: relative;

        width: 100%;
        height: 100vh;

        background:
          radial-gradient(
            circle at top left,
            rgb(245, 133, 111) 0%,
            rgba(245, 133, 111, 0) 38%
          ),
          radial-gradient(
            circle at top center,
            rgb(244, 231, 97) 0%,
            rgba(244, 231, 97, 0) 42%
          ),
          radial-gradient(
            circle at top right,
            rgb(190, 250, 148) 0%,
            rgba(190, 250, 148, 0) 30%
          ),
          radial-gradient(
            circle at center,
            rgb(190, 250, 148) 0%,
            rgba(190, 250, 148, 0) 32%
          ),
          radial-gradient(
            circle at bottom left,
            rgb(190, 250, 147) 0%,
            rgba(190, 250, 147, 0) 28%
          ),
          radial-gradient(
            circle at bottom center,
            rgb(109, 190, 241) 0%,
            rgba(109, 190, 241, 0) 35%
          ),
          radial-gradient(
            circle at bottom right,
            rgb(238, 114, 189) 0%,
            rgba(238, 114, 189, 0) 24%
          ),
          linear-gradient(
            135deg,
            rgb(247, 171, 103) 0%,
            rgb(232, 245, 99) 28%,
            rgb(187, 249, 149) 52%,
            rgb(109, 190, 241) 78%,
            rgb(184, 118, 216) 100%
          );
      }

      .glass {
        position: absolute;
        right: 30px;
        bottom: 0px;
      }

      .glass img {
        width: 700px;
        height: 400px;
      }
      .scoreBox {
        position: absolute;
        width: 700px;
        height: 600px;
        background-color: transparent;
        top: 50px;
        left: 100px;
      }

      .rankingBox {
        position: absolute;
        width: 300px;
        height: 400px;
        background-color: white;
        top: 50px;
        left: 1050px;
      }
      .result {
        position: absolute;
        top: 650px;
        left: 400px;
      }
      .resultbtn {
        width: 600px;
        height: 178px;
        background-color: transparent;
        border: none;
        border-radius: 10px;
        font-size: 68px;
        cursor: pointer;
        color: white;
        -webkit-text-stroke: 3px black;
      }

      .scoreBox-text {
        font-size: 50px;
        font-weight: bold;
        text-align: center;
        position: relative;
        top: 300px;
      }

      .scoreBox-score {
        font-size: 24px;
        margin-top: 20px;
        text-align: center;
        position: relative;
        top: 300px;
      }
      .aje {
        position: absolute;
        width: 400px;
        height: auto;
        top: 50px;
        left: 150px;
      }
    </style>
  </head>

  <body>
    <div class="rainbow-bg">
      <div class="scoreBox">
        <img class="aje" src="aje.png" alt="" />
        <p class="scoreBox-text">아재시군요…. 아자스!!</p>
        <p class="scoreBox-score">당신의 점수는 0점입니다.</p>
      </div>

      <div class="rankingBox"></div>
      <div class="glass">
        <img src="glass.png" alt="" />
      </div>
      <div class="result">
        <button class="resultbtn">결과 보러 가기</button>
      </div>
    </div>
  </body>
</html>
