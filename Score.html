<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>결과 페이지</title>

    <style>
      body {
        margin: 0;
      }

      .rainbow-bg {
        position: relative;
        width: 100%;
        height: 100vh;

        background:
          radial-gradient(
            circle at top left,
            rgb(245, 133, 111) 0%,
            rgba(245, 133, 111, 0) 38%
          ),
          radial-gradient(
            circle at top center,
            rgb(244, 231, 97) 0%,
            rgba(244, 231, 97, 0) 42%
          ),
          radial-gradient(
            circle at top right,
            rgb(190, 250, 148) 0%,
            rgba(190, 250, 148, 0) 30%
          ),
          radial-gradient(
            circle at center,
            rgb(190, 250, 148) 0%,
            rgba(190, 250, 148, 0) 32%
          ),
          radial-gradient(
            circle at bottom left,
            rgb(190, 250, 147) 0%,
            rgba(190, 250, 147, 0) 28%
          ),
          radial-gradient(
            circle at bottom center,
            rgb(109, 190, 241) 0%,
            rgba(109, 190, 241, 0) 35%
          ),
          radial-gradient(
            circle at bottom right,
            rgb(238, 114, 189) 0%,
            rgba(238, 114, 189, 0) 24%
          ),
          linear-gradient(
            135deg,
            rgb(247, 171, 103) 0%,
            rgb(232, 245, 99) 28%,
            rgb(187, 249, 149) 52%,
            rgb(109, 190, 241) 78%,
            rgb(184, 118, 216) 100%
          );
      }

      .glass {
        position: absolute;
        right: 30px;
        bottom: 0px;
      }

      .glass img {
        width: 700px;
        height: 400px;
      }

      /* 결과 박스 */
      .scoreBox {
        position: absolute;
        width: 700px;
        height: 600px;
        top: 50px;
        left: 100px;
        text-align: center;
      }

      /* 이미지 */
      .aje {
        position: absolute;
        width: 420px;
        height: auto;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
      }

      .last-result {
        width: 360px;
        top: 10px;
      }

      .scoreBox-text {
        font-size: 50px;
        font-weight: bold;
        position: absolute;
        top: 430px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        margin: 0;
        color: white;
        -webkit-text-stroke: 2px black;
      }

      .scoreBox-score {
        font-size: 28px;
        position: absolute;
        top: 520px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        margin: 0;
      }

      .rankingBox {
        position: absolute;
        width: 300px;
        height: 400px;
        background-color: white;
        top: 50px;
        left: 1050px;
      }

      .result {
        position: absolute;
        top: 650px;
        left: 400px;
      }

      .resultbtn {
        width: 600px;
        height: 178px;
        background-color: transparent;
        border: none;
        font-size: 68px;
        cursor: pointer;
        color: white;
        -webkit-text-stroke: 2px black;
        transition: all 0.3s ease;
      }
      .resultbtn:hover {
        transform: scale(1.03);
        color: #ffd700;
      }
    </style>
  </head>

  <body>
    <div class="rainbow-bg">
      <div class="scoreBox">
        <img class="aje" src="./images/aje.png" />
        <p class="scoreBox-text">결과 텍스트</p>
        <p class="scoreBox-score">점수</p>
      </div>

      <div class="rankingBox"></div>

      <div class="glass">
        <img src="./images/glass.png" />
      </div>

      <div class="result">
        <a href="./ResultPage.html" class="resultbtn">결과 보러 가기</a>
      </div>
    </div>

    <script>
      const resultData = [
        {
          min: 0,
          max: 20,
          img: "./images/aje.png",
          text: "아재시군요…. 아자스!!",
        },
        {
          min: 21,
          max: 40,
          img: "./images/aje2.png",
          text: "밈 사망선고 내리겠습니다 삐———-",
        },
        {
          min: 41,
          max: 60,
          img: "./images/aje3.png",
          text: "당신은 M도 Z도 아닌 그 무언가…",
        },
        { min: 61, max: 80, img: "./images/mz.png", text: "당신 꽤나 MZ?" },
        {
          min: 81,
          max: 100,
          img: "./images/mz2.png",
          text: "당신을 밈 지박령으로 임명합니다",
        },
      ];

      const params = new URLSearchParams(window.location.search);
      const nickname = params.get("nickname");
      const totalScore = JSON.parse(localStorage.getItem(nickname)).totalScore;
      const category = JSON.parse(localStorage.getItem(nickname)).category;

      const imgEl = document.querySelector(".aje");
      const textEl = document.querySelector(".scoreBox-text");
      const scoreEl = document.querySelector(".scoreBox-score");

      const result = resultData.find(
        (item) => totalScore >= item.min && totalScore <= item.max,
      );

      if (result) {
        imgEl.src = result.img;
        textEl.innerText = result.text;
        scoreEl.innerText = `당신의 점수는 ${totalScore}점입니다.`;

        if (totalScore >= 81) {
          imgEl.classList.add("last-result");
        }
      }
    </script>
  </body>
</html>
