<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap"
      rel="stylesheet"
    />
    <title>결과 페이지</title>

    <style>
      body {
        margin: 0;
        font-family: "Do Hyeon", sans-serif;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      ::-webkit-scrollbar {
        display: none;
      }

      .rainbow-bg {
        position: relative;
        width: 100%;
        height: 100vh;

        background:
          radial-gradient(
            circle at top left,
            rgb(245, 133, 111) 0%,
            rgba(245, 133, 111, 0) 38%
          ),
          radial-gradient(
            circle at top center,
            rgb(244, 231, 97) 0%,
            rgba(244, 231, 97, 0) 42%
          ),
          radial-gradient(
            circle at top right,
            rgb(190, 250, 148) 0%,
            rgba(190, 250, 148, 0) 30%
          ),
          radial-gradient(
            circle at center,
            rgb(190, 250, 148) 0%,
            rgba(190, 250, 148, 0) 32%
          ),
          radial-gradient(
            circle at bottom left,
            rgb(190, 250, 147) 0%,
            rgba(190, 250, 147, 0) 28%
          ),
          radial-gradient(
            circle at bottom center,
            rgb(109, 190, 241) 0%,
            rgba(109, 190, 241, 0) 35%
          ),
          radial-gradient(
            circle at bottom right,
            rgb(238, 114, 189) 0%,
            rgba(238, 114, 189, 0) 24%
          ),
          linear-gradient(
            135deg,
            rgb(247, 171, 103) 0%,
            rgb(232, 245, 99) 28%,
            rgb(187, 249, 149) 52%,
            rgb(109, 190, 241) 78%,
            rgb(184, 118, 216) 100%
          );
      }

      .glass {
        position: absolute;
        right: 30px;
        bottom: 0px;
      }

      .glass img {
        width: 500px;
        height: 350px;
      }

      /* 결과 박스 */
      .scoreBox {
        position: absolute;
        width: 700px;
        height: 600px;
        top: 50px;
        left: 100px;
        text-align: center;
      }

      /* 이미지 */
      .aje {
        position: absolute;
        width: 420px;
        height: auto;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
      }

      .last-result {
        width: 360px;
        top: 10px;
      }

      .scoreBox-text {
        font-size: 50px;
        font-weight: bold;
        position: absolute;
        top: 430px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        margin: 0;
        color: white;
        -webkit-text-stroke: 2px black;
      }

      .scoreBox-score {
        font-size: 28px;
        position: absolute;
        top: 520px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        margin: 0;
      }

      .result {
        position: absolute;
        left: 40%;
        bottom: 30px;
      }

      .resultbtn {
        background-color: transparent;
        border: none;
        font-size: 68px;
        cursor: pointer;
        color: white;
        -webkit-text-stroke: 2px black;
        transition: all 0.3s ease;
      }
      .resultbtn:hover {
        transform: scale(1.03);
        color: #ffd700;
      }

      .close_btn {
        padding: 10px 20px;
        background-color: rgb(116, 0, 0);
        border: none;
        border-radius: 5px;
        color: #fff;
        cursor: pointer;
        transition: box-shadow 0.2s;
      }

      .category_text {
        width: 100px;
        margin: 5px;
        padding: 8px 12px;
        border: none;
        border-radius: 10px;
        background: rgb(255, 255, 255, 0.2);
        color: black;
        font-weight: bold;
        font-family: "Do Hyeon", sans-serif;
      }

      .modal_popup {
        font-family: "Do Hyeon", sans-serif;
        position: absolute;
        background-color: rgb(255, 255, 255, 0.3);
        width: 300px;
        top: 50px;
        right: 100px;
        max-height: 80vh;
        overflow-y: auto;
        border-radius: 20px;
        padding: 25px;
        text-align: center;
        animation: popup 0.3s ease;
      }

      .modal_popup table {
        width: 100%;
        border-collapse: collapse;
      }

      .modal_popup th,
      .modal_popup td {
        padding: 10px;
      }

      .modal_popup th {
        background: rgb(255, 255, 255, 0.3);
      }

      .table-wrap {
        height: 260px;
        margin-top: 15px;
        overflow-y: auto;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      th,
      td {
        padding: 10px 14px;
        text-align: center;
      }

      th {
        background: rgb(255, 255, 255, 0.3);
      }
    </style>
  </head>

  <body>
    <div class="rainbow-bg">
      <div class="scoreBox">
        <img class="aje" src="./images/aje.png" />
        <p class="scoreBox-text">결과 텍스트</p>
        <p class="scoreBox-score">점수</p>
      </div>

      <div class="modal_popup">
        <div style="display: flex; justify-content: center">
          <div id="categoryText" class="category_text"></div>
        </div>

        <div class="table-wrap">
          <table>
            <colgroup>
              <col style="width: 25%" />
              <col style="width: 50%" />
              <col style="width: 25%" />
            </colgroup>
            <thead>
              <tr>
                <th>등수</th>
                <th>아이디</th>
                <th>점수</th>
              </tr>
            </thead>
            <tbody id="ranking"></tbody>
          </table>
        </div>
      </div>

      <div class="glass">
        <img src="./images/glass.png" />
      </div>

      <div class="result">
        <button onclick="resultPage();" class="resultbtn">결과 보러 가기</button>
      </div>
    </div>

    <script type="module">
      const resultData = [
        {
          min: 0,
          max: 20,
          img: "./images/aje.png",
          text: "아재시군요…. 아자스!!",
        },
        {
          min: 21,
          max: 40,
          img: "./images/aje2.png",
          text: "밈 사망선고 내리겠습니다 삐———-",
        },
        {
          min: 41,
          max: 60,
          img: "./images/aje3.png",
          text: "당신은 M도 Z도 아닌 그 무언가…",
        },
        { min: 61, max: 80, img: "./images/mz.png", text: "당신 꽤나 MZ?" },
        {
          min: 81,
          max: 100,
          img: "./images/mz2.png",
          text: "당신을 밈 지박령으로 임명합니다",
        },
      ];

      const params = new URLSearchParams(window.location.search);
      const nickname = params.get("nickname");
      const totalScore = JSON.parse(localStorage.getItem(nickname)).totalScore;
      const category = JSON.parse(localStorage.getItem(nickname)).category;

      const categoryText = category === "classic" ? "클래식" : category;

      const imgEl = document.querySelector(".aje");
      const textEl = document.querySelector(".scoreBox-text");
      const scoreEl = document.querySelector(".scoreBox-score");

      document.getElementById("categoryText").textContent =
        `${categoryText} 밈 랭킹`;

      const result = resultData.find(
        (item) => totalScore >= item.min && totalScore <= item.max,
      );

      if (result) {
        imgEl.src = result.img;
        textEl.innerText = result.text;
        scoreEl.innerText = `당신의 점수는 ${totalScore}점입니다.`;

        if (totalScore >= 81) {
          imgEl.classList.add("last-result");
        }
      }

      function resultPage() {
        window.location.href = `./ResultPage.html?nickname=${encodeURIComponent(nickname)}`;
      }
      function getRankingByCategory(targetCategory) {
        const ranking = [];

        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          const rawValue = localStorage.getItem(key);

          if (!rawValue) continue;

          try {
            const data = JSON.parse(rawValue);

            if (
              data &&
              typeof data === "object" &&
              data.category === targetCategory &&
              typeof data.totalScore === "number"
            ) {
              ranking.push({
                id: data.nickname,
                score: data.totalScore,
              });
            }
          } catch (error) {
            continue;
          }
        }

        ranking.sort((a, b) => b.score - a.score);

        return ranking;
      }

      function renderRanking(data, title) {
        let rows = "";

        for (let i = 0; i < data.length; i++) {
          rows += `
          <tr>
            <td style="width: ">${i + 1}등</td>
            <td>${data[i].id}</td>
            <td>${data[i].score}</td>
          </tr>
        `;
        }

        document.getElementById("ranking").innerHTML = `
        
          <tbody>
            ${rows}
          </tbody>
 
      `;
      }
      renderRanking(getRankingByCategory(category));
    </script>
  </body>
</html>
