<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Academy</title>

    <link rel="stylesheet" href="mainBG.css">

    <style>
        .head {
            width: 100%;
            height: 20%;
            background-size: 200px;
            background-image: url(./images/bonobono.png);
            transform: scaleY(-1);
            background-repeat: round;
        }
        .footer {
            width: 100%;
            height: 20%;
            background-size: 200px;
            background-image: url(./images/bonobono.png);
            background-repeat: round;
            position: absolute;
            bottom: 0;
        }
        .wrapper {
            align-items: center;
            display: flex;
            justify-content: center;
            width: 100%;
            height: 60%;
        }
        .container {
            border: 10px solid rgb(133, 77, 60);
            width: 80%;
            height: 100%;
            background-color: rgb(10, 49, 10);
            box-shadow: 5px 5px 10px 5px #ddd;
            color: white;
            font-size: 35px;
            font-weight: bold;
        }

        #ansList {
            display: flex;
            justify-content: space-evenly;
            width: 100%;
            height: 100%;
        }
        .list {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: center;
            font-size: 45px;
        }
        #left, #right {
            display: grid;
            justify-content: space-between;
        }

        button{
            color: #ffffff;
            text-align:center;
            background-color: #96a9fe;
            border: none;
            border-radius: 3px;
            padding-left: 15px;
            padding-right: 15px;
            min-height: 20px; min-width: 70px;
            height: 30%;
            cursor: pointer;
            font-size: 20px;
        }

        button:hover{
            color: #654de0;
            background-color: #dee1fd;
            transition: 0.3s;
        }
    </style>

    <script>
        let memes = [];
        let list = [];
        let user = [];
        let num = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch("./Meme.json");
                const response2 = await fetch("./user.json");
                memes.list = await response.json();
                user = await response2.json();

                console.log(memes.list);
                console.log(memes.list.meme2024[0].memeName);
                console.log(user);

            
                if (memes.list.meme2024 === user.year) {
                    for(let i=0; i<memes.list.meme2024.length; i++) {
                        if(num<6) {
                            document.getElementById('left').innerHTML += 
                            `<div class="list">
                                문제${num++} ${memes.list.meme2024[i].memeName}
                                <button type="button" onclick="location.href='${memes.list.meme2024[i].originUrl}'">밈 유래 보러가기</button>
                            </div>`
                        } else {
                            document.getElementById('right').innerHTML += 
                            `<div class="list">
                                문제${num++} ${memes.list.meme2024[i].memeName}
                                <button type="button" onclick="location.href='${memes.list.meme2024[i].originUrl}'">밈 유래 보러가기</button>
                            </div>`
                        }
                    }
                } else if (memes.list.meme2025 === user.year) {
                    for(let i=0; i<memes.list.meme2025.length; i++) {
                        if(num<6) {
                            document.getElementById('left').innerHTML += 
                            `<div class="list">
                                문제${num++} ${memes.list.meme2025[i].memeName}
                                <button type="button" onclick="location.href='${memes.list.meme2025[i].originUrl}'">밈 유래 보러가기</button>
                            </div>`
                        } else {
                            document.getElementById('right').innerHTML += 
                            `<div class="list">
                                문제${num++} ${memes.list.meme2025[i].memeName}
                                <button type="button" onclick="location.href='${memes.list.meme2025[i].originUrl}'">밈 유래 보러가기</button>
                            </div>`
                        }
                    }
                } else {
                    for(let i=0; i<memes.list.classicMeme.length; i++) {
                        if(num<6) {
                            document.getElementById('left').innerHTML += 
                            `<div class="list">
                                문제${num++} ${memes.list.classicMeme[i].memeName}
                                <button type="button" onclick="location.href='${memes.list.classicMeme[i].originUrl}'">밈 유래 보러가기</button>
                            </div>`
                        } else {
                            document.getElementById('right').innerHTML += 
                            `<div class="list">
                                문제${num++} ${memes.list.classicMeme[i].memeName}
                                <button type="button" onclick="location.href='${memes.list.classicMeme[i].originUrl}'">밈 유래 보러가기</button>
                            </div>`
                        }
                    }
                }
            } catch (error) {
                console.error("Meme.json 불러오기 실패:", error);
            }
        });
    </script>
</head>
<body>
<div class="rainbow-bg">
    <div class="head"></div>
    <div class="wrapper">
        <div class="container">
            <div id="ansList">
                <div id="left"></div>
                <div id="right"></div>
            </div>
        </div>
    </div>
    <div class="footer"></div>
</div>
</body>
</html>
