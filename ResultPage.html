<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Academy</title>

    <link rel="stylesheet" href="mainBG.css">

    <style>
        .head {
            width: 100%;
            height: 20%;
            background-size: 200px;
            background-image: url(./images/bonobono.png);
            transform: scaleY(-1);
            background-repeat: round;
        }
        .footer {
            width: 100%;
            height: 20%;
            background-size: 200px;
            background-image: url(./images/bonobono.png);
            background-repeat: round;
            position: absolute;
            bottom: 0;
        }
        .wrapper {
            align-items: center;
            display: flex;
            justify-content: center;
            width: 100%;
            height: 60%;
        }
        .container {
            border: 10px solid rgb(133, 77, 60);
            width: 80%;
            height: 100%;
            background-color: rgb(10, 49, 10);
            box-shadow: 5px 5px 10px 5px #ddd;
            color: white;
            font-size: 35px;
            font-weight: bold;
        }

        #ansList {
            display: flex;
            justify-content: space-evenly;
            width: 100%;
            height: 100%;
        }
        .list {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            font-size: 30px;
        }
        #left, #right {
            display: grid;
            justify-content: space-between;
        }

        button{
            color: #ffffff;
            text-align:center;
            background-color: #96a9fe;
            border: none;
            border-radius: 3px;
            padding-left: 15px;
            padding-right: 15px;
            min-height: 20px; min-width: 70px;
            height: 30%;
            cursor: pointer;
            font-size: 20px;
        }

        button:hover{
            color: #654de0;
            background-color: #dee1fd;
            transition: 0.3s;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 20%;
            position: absolute;
            bottom: 0;
            z-index: 1;
        }
        .btnCss {
            background-color: transparent;
            border: none;
            font-size: 68px;
            cursor: pointer;
            color: white;
            -webkit-text-stroke: 2px black;
            transition: all 0.3s ease;
            text-decoration-line: none;
        }
        .btnCss:hover {
            transform: scale(1.03);
            color: #ffd700;
        }
    </style>

    <script>
        const params = new URLSearchParams(window.location.search);
        const nickname = params.get("nickname");
        const category = JSON.parse(localStorage.getItem(nickname)).category;
        const answers = JSON.parse(localStorage.getItem(nickname)).answers;

        let memes = [];
        let num = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                console.log(category);
                if (category === "2024") {
                    const response = await fetch("./meme2024.json");
                    memes.list = await response.json();
                }
                else if (category === "2025") {
                    const response = await fetch("./meme2025.json");
                    memes.list = await response.json();
                }
                else {
                    const response = await fetch("./memeClassic.json");
                    memes.list = await response.json();
                }

                for(let i=0; i<memes.list.length; i++) {
                    if(num<6) {
                        if(answers.includes(answers[i])) {
                            document.getElementById('left').innerHTML += 
                            `<div class="list" style="color: red">
                                문제${num++} ${memes.list[i].memeName}
                                <button type="button" onclick="location.href='${memes.list[i].originUrl}'">밈 유래 보러가기</button>
                            </div>`
                        } else {
                            document.getElementById('left').innerHTML += 
                            `<div class="list">
                                문제${num++} ${memes.list[i].memeName}
                                <button type="button" onclick="location.href='${memes.list[i].originUrl}'">밈 유래 보러가기</button>
                            </div>`
                        }  
                    } else {
                        if(answers.includes(answers[i])) {
                            document.getElementById('right').innerHTML += 
                            `<div class="list" style="color: red">
                                문제${num++} ${memes.list[i].memeName}
                                <button type="button" onclick="location.href='${memes.list[i].originUrl}'">밈 유래 보러가기</button>
                            </div>`
                        } else {
                            document.getElementById('right').innerHTML += 
                            `<div class="list">
                                문제${num++} ${memes.list[i].memeName}
                                <button type="button" onclick="location.href='${memes.list[i].originUrl}'">밈 유래 보러가기</button>
                            </div>`
                        }  
                    }
                }
            } catch (error) {
                console.error("json 불러오기 실패:", error);
            }
        });
    </script>
</head>
<body>
<div class="rainbow-bg">
    <div class="head"></div>
    <div class="wrapper">
        <div class="container">
            <div id="ansList">
                <div id="left"></div>
                <div id="right"></div>
            </div>
        </div>
    </div>
    <div class="btn">
        <a href="./index.html" class="btnCss">처음으로 돌아가기</a>
    </div>
    <div class="footer"></div>
</div>
</body>
</html>
